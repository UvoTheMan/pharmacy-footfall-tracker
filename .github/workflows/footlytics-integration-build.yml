name: Footlytics integration build

on:
  push:
    branches:
      - release/footlytics-integration-2026-10-15
      - fix/mobile-chrome-resume-loading-2026-10-15
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - "tsconfig*.json"
      - "vite.config.*"
      - "index.html"
      - "supabase/**"
      - "scripts/**"
      - ".github/workflows/footlytics-integration-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: TypeScript and Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build application
        run: npm run build
