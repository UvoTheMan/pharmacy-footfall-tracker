name: Daily Footfall CSV Backup

on:
  schedule:
    - cron: "59 22 * * *"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/daily-footfall-backup.yml"
      - "scripts/daily_footfall_backup.py"
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Choose which Supabase project to read (Production test should remain a dry run)"
        required: true
        type: choice
        options:
          - staging
          - Production
        default: staging
      send_email:
        description: "Send email after generating CSVs (leave unchecked for a safe dry run)"
        required: true
        type: boolean
        default: false
      backup_date:
        description: "Optional Lagos date (YYYY-MM-DD); blank means today unless a date range is supplied"
        required: false
        type: string
      start_date:
        description: "Optional manual export start date (YYYY-MM-DD)"
        required: false
        type: string
      end_date:
        description: "Optional manual export end date (YYYY-MM-DD)"
        required: false
        type: string
      report_scope:
        description: "Admin: all reports; staff: assigned branch only"
        required: true
        type: choice
        options:
          - all
          - gbagada
          - akoka
          - sangotedo
        default: all

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || (github.event_name == 'schedule' && 'Production' || 'staging') }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate reports and optionally email
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BACKUP_FROM_EMAIL: ${{ secrets.BACKUP_FROM_EMAIL }}
          BACKUP_RECIPIENTS: ${{ secrets.BACKUP_RECIPIENTS }}
          BACKUP_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.backup_date || '' }}
          BACKUP_START_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.start_date || '' }}
          BACKUP_END_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.end_date || '' }}
          SEND_BACKUP_EMAIL: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.send_email) || false }}
          BACKUP_EMAIL_PROVIDER: ${{ github.event_name == 'schedule' && 'smtp' || 'resend' }}
          BACKUP_REPORT_SCOPE: ${{ github.event_name == 'schedule' && 'all' || (github.event_name == 'workflow_dispatch' && inputs.report_scope) || 'all' }}
        run: python scripts/daily_footfall_backup.py

      - name: Save CSVs for inspection
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || (github.event_name == 'schedule' && 'Production' || 'staging') }}-footfall-csv-test
          path: backup-output/*.csv
          if-no-files-found: error
          retention-days: 1
